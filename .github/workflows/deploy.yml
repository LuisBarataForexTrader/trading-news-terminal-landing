name: Deploy to Cloudflare Pages

# Auto-deploy da landing (www.tradingnewsterminal.com + raiz) para o projeto Cloudflare
# Pages "tnt-landing" a cada push na main. O wrangler compila tambem functions/ (proxy
# do /blog, /news, /pt, sitemaps para o backend). Substitui o deploy da Vercel (pausada).
# Precisa dos secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tnt-landing --branch=main --commit-dirty=true
